# Runs on every push and PR so a broken drivers.json edit (or a bug in
# validate_data.py itself) is caught before it reaches the live site.
# Only push/workflow_dispatch actually deploy - PRs run the same
# validate-and-build job as a check, but stop there (see the `if:` guards
# below), so a PR can never push a chart commit or publish to Pages.
name: Validate and Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Required by actions/deploy-pages: id-token to mint the OIDC token Pages
# deployment auth uses, pages to publish, contents:write so the chart-commit
# step below can push back to the repo.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment can run at a time; a second push while one is
# still deploying waits for the first to finish rather than racing it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      - name: Validate drivers.json
        run: |
          python scripts/validate_data.py src/_data/drivers.json

      - name: Generate trend chart
        run: |
          python scripts/generate_chart.py

      # generate_chart.py always rewrites the SVG, but its output only
      # actually changes when drivers.json changed - `git diff --quiet` skips
      # the commit+push (and the extra CI run it would trigger) when the
      # chart came out byte-identical to what's already committed.
      - name: Commit updated chart if drivers.json changed it
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- src/assets; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/assets/bugs-chart-dark.svg
            git commit -m "chore: refresh bug trend chart [skip ci]"
            git push
          else
            echo "Chart unchanged, nothing to commit."
          fi

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
